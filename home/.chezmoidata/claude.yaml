claude:
  permissions:
    defaultMode: auto

  hooks:
    PreToolUse:
      - matcher: Bash
        hooks:
          - type: command
            command: ~/.claude/hooks/enforce-builtin-tools.sh

  statusLine:
    type: command
    command: bunx --bun ccstatusline
    padding: 0
    refreshInterval: 10

  agentPushNotifEnabled: true
  autoUpdatesChannel: latest
  enableWorkflows: true
  inputNeededNotifEnabled: true
  theme: auto
  tui: fullscreen
