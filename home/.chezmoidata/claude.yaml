claude:
  permissions:
    defaultMode: auto

  statusLine:
    type: command
    command: ccstatusline
    padding: 0
    refreshInterval: 10

  enabledPlugins:
    cowork-plugin-management@synced: false
    context7@context7-marketplace: true

  skillOverrides:
    anthropic-skills:artifact-emulator: "off"
    anthropic-skills:built-in-browser: "off"
    anthropic-skills:chrome-browser: "off"
    anthropic-skills:computer-use: "off"
    anthropic-skills:deep-research: "user-invocable-only"
    anthropic-skills:docs: "off"
    anthropic-skills:docx: "user-invocable-only"
    anthropic-skills:google-workspace: "off"
    anthropic-skills:import-memory: "user-invocable-only"
    anthropic-skills:morning: "off"
    anthropic-skills:pdf: "user-invocable-only"
    anthropic-skills:pptx: "user-invocable-only"
    anthropic-skills:skill-creator: "user-invocable-only"
    anthropic-skills:xlsx: "user-invocable-only"
    find-skills: "on"

  agentPushNotifEnabled: true
  autoUpdatesChannel: latest
  disableClaudeAiConnectors: true
  enableWorkflows: true
  inputNeededNotifEnabled: true
  remoteControlAtStartup: true
  theme: auto
  tui: fullscreen
