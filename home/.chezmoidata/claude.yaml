claude:
  permissions:
    defaultMode: auto

  statusLine:
    type: command
    command: bunx --bun ccstatusline
    padding: 0
    refreshInterval: 10

  agentPushNotifEnabled: true
  autoUpdatesChannel: latest
  enableWorkflows: true
  inputNeededNotifEnabled: true
  theme: auto
  tui: fullscreen

mcp:
  servers:
    github:
      type: http
      url: https://api.githubcopilot.com/mcp/
      headers:
        Authorization: Bearer $(gh auth token)
    context7:
      type: http
      url: https://mcp.context7.com/mcp
      headers:
        Authorization: Bearer $(op read 'op://Chezmoi/CONTEXT7_API_KEY/credential')
